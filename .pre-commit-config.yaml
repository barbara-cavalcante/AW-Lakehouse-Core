# Configuration to define which git hooks will be automatically installed
default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  # Ensures all commit messages follow the Conventional Commits
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []
  # General hooks for file integrity and basic quality
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
        exclude: .github
    -  id: check-yaml
    -  id: check-json
    -  id: check-added-large-files
  # Black: code formatter to ensure style consistency
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 25.12.0
    hooks:
      - id: black

  # Ruff: Python linter and formatters
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.11
    hooks:
    - id: ruff-check
    - id: ruff-format

  # Detect-secrets: Critical security layer to prevent credential leaks
  # Scans for passwords or API keys before they are committed to the repository.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
    -   id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package.lock.json